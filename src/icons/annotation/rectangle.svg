<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img">
<title>Rectangle</title><desc>Draw an empty blue rectangle from hollow mouse-down at (6,7) to solid mouse-up at (26,25).</desc>
<defs><linearGradient id="frame-blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8dd9ff"/><stop offset="1" stop-color="#499aca"/></linearGradient></defs>
<rect id="drawn-rectangle" x="6" y="7" width="20" height="18" fill="none" stroke="url(#frame-blue)" stroke-width="2"/>
<g id="mouse-down"><circle cx="6" cy="7" r="2.7" fill="none" stroke="#111317" stroke-width="2.4"/><circle cx="6" cy="7" r="2.7" fill="none" stroke="#fff6df" stroke-width="1.4"/></g><circle id="mouse-up" cx="26" cy="25" r="2.6" fill="#fff6df" stroke="#111317" stroke-width="0.8"/>
</svg>
