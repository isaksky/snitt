<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img">
  <title>Arrow</title>
  <desc>Draw a blue arrow from the hollow mouse-down circle at the top left to the solid mouse-up circle at the bottom right.</desc>
  <defs>
    <linearGradient id="arrow-blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8dd9ff"/>
      <stop offset="1" stop-color="#499aca"/>
    </linearGradient>
  </defs>
  <path d="M6 7L20 21" fill="none" stroke="url(#arrow-blue)" stroke-width="3" stroke-linecap="round"/>
  <path d="M13 24L26 26L24 13Z" fill="url(#arrow-blue)"/>
  <path d="M13 24L26 26" fill="none" stroke="#b1e5ff" stroke-width="1" stroke-linejoin="round"/>
  <g id="mouse-down">
    <circle cx="6" cy="7" r="2.7" fill="none" stroke="#111317" stroke-width="2.4"/>
    <circle cx="6" cy="7" r="2.7" fill="none" stroke="#fff6df" stroke-width="1.4"/>
  </g>
  <circle id="mouse-up" cx="26" cy="26" r="2.6" fill="#fff6df" stroke="#111317" stroke-width="0.8"/>
</svg>
