name: Draft release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag (v1.2.3)
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release source
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'Use an existing stable version tag such as v1.2.3.' >&2; exit 1;
          }
          commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$commit" "origin/$DEFAULT_BRANCH"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    uses: ./.github/workflows/build.yml
    with:
      source-ref: ${{ needs.resolve.outputs.commit }}
      version: ${{ needs.resolve.outputs.version }}
      package: true

  draft:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-package'
          path: build/artifacts
      - name: Verify archives and generate release metadata
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          python scripts/test-release-metadata.py
          python scripts/release_metadata.py assemble "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" --commit "$RELEASE_COMMIT" \
            --artifacts build/artifacts --output build/release
          ruby -c build/release/snitt.rb
      - name: Create or refresh the draft for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > build/existing-release.json; then
            jq -e --arg commit "$RELEASE_COMMIT" \
              '.isDraft == true and .targetCommitish == $commit' build/existing-release.json
            gh release upload "$RELEASE_TAG" build/release/* --clobber
          else
            gh release create "$RELEASE_TAG" build/release/* --verify-tag \
              --target "$RELEASE_COMMIT" --draft --title "Snitt $RELEASE_TAG" \
              --notes-file .github/release-notes.md
          fi
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
